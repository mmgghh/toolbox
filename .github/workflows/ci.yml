name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # One run each on macOS and Windows to catch path and platform
          # assumptions; the full version matrix there would be overkill.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install DejaVu fonts (for pymd2pdf tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Lint
        run: ruff check .

  minimal-install:
    name: Import without optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # A bare install is what Termux users get; every command except
      # pymd2pdf must still start.
      - run: pip install -e .
      - name: Smoke test the core commands
        run: |
          toolbox --version
          toolbox doctor
          pyjdate now
          pystr case --to snake --text "Hello World"
          pynet url "a b"
          pyfm --help
          pytime --help
          pyssh --help
      # Completion asks the umbrella for every subcommand, so a subcommand
      # whose dependency is absent must not take the whole thing down.
      - name: Smoke test shell completion
        run: |
          toolbox completion bash > /dev/null
          COMP_WORDS="toolbox " COMP_CWORD=1 _TOOLBOX_COMPLETE=bash_complete toolbox \
            | grep -qx "plain,md2pdf"
